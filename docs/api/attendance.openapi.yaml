openapi: 3.0.3
info:
  title: TechGeo Attendance Service API
  version: 1.0.0
  description: Dual-layer presence verification.

servers:
  - url: https://techgeo-attendance.onrender.com

paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK

  /checkin:
    post:
      summary: Register presence for an employee
      responses:
        "201":
          description: Log written

  /presence/{orgId}:
    get:
      summary: Read the current presence snapshot for an organization
      parameters:
        - in: path
        name: orgId
        required: true
        schema: { type: integer }
      responses:
        "200":
          description: Snapshot returned
