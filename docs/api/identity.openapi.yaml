openapi: 3.0.3
info:
  title: TechGeo Identity Service API
  version: 1.0.0
  description: National identity traceback and device binding.

servers:
  - url: https://techgeo-identity.onrender.com

paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK

  /device/bind:
    post:
      summary: Bind a device fingerprint to an account
      responses:
        "201":
          description: Binding recorded

  /device/revoke:
    post:
      summary: Revoke a device binding
      responses:
        "200":
          description: Revoked

  /kyc/verify:
    post:
      summary: Verify a national ID
      responses:
        "200":
          description: Verification result

  /traceback/register:
    post:
      summary: Register encrypted identity data
      responses:
        "201":
          description: Registered
