services:
  - type: web
    name: techgeo-gateway
    runtime: docker
    dockerfilePath: ./deploy/render-backend/Dockerfile.gateway
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: techgeo-common
      - key: SERVICE_NAME
        value: gateway
      - key: PORT
        value: "3000"

  - type: web
    name: techgeo-currency
    runtime: docker
    dockerfilePath: ./deploy/render-backend/Dockerfile.currency
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: techgeo-common
      - key: SERVICE_NAME
        value: currency

  - type: web
    name: techgeo-identity
    runtime: docker
    dockerfilePath: ./deploy/render-backend/Dockerfile.identity
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: techgeo-common
      - key: SERVICE_NAME
        value: identity

  - type: web
    name: techgeo-maps
