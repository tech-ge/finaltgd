name: ai-train

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-training:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/shadow-student/requirements.txt

      - name: Export gold logs
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: bash scripts/export-gold-logs.sh

      - name: Train Shadow Student
        run: bash scripts/train-shadow.sh
