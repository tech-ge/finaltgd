apiVersion: apps/v1
kind: Deployment
metadata:
  name: techgeo-identity
  namespace: techgeo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techgeo-identity
  template:
    metadata:
      labels:
        app: techgeo-identity
    spec:
      containers:
        - name: identity
          image: techgeo/identity:latest
          ports:
            - containerPort: 3003
          envFrom:
            - secretRef:
                name: techgeo-identity-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
