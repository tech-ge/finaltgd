apiVersion: apps/v1
kind: Deployment
metadata:
  name: techgeo-assistant
  namespace: techgeo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techgeo-assistant
  template:
    metadata:
      labels:
        app: techgeo-assistant
    spec:
      containers:
        - name: assistant
          image: techgeo/assistant:latest
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: techgeo-assistant-secrets
