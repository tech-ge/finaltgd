apiVersion: apps/v1
kind: Deployment
metadata:
  name: techgeo-gateway
  namespace: techgeo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techgeo-gateway
  template:
    metadata:
      labels:
        app: techgeo-gateway
    spec:
      containers:
        - name: gateway
          image: techgeo/gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: techgeo-gateway-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
