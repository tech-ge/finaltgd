apiVersion: apps/v1
kind: Deployment
metadata:
  name: techgeo-currency
  namespace: techgeo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techgeo-currency
  template:
    metadata:
      labels:
        app: techgeo-currency
    spec:
      containers:
        - name: currency
          image: techgeo/currency:latest
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: techgeo-currency-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
