apiVersion: apps/v1
kind: Deployment
metadata:
  name: techgeo-ai-orchestrator
  namespace: techgeo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techgeo-ai-orchestrator
  template:
    metadata:
      labels:
        app: techgeo-ai-orchestrator
    spec:
      containers:
        - name: ai-orchestrator
          image: techgeo/ai-orchestrator:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: techgeo-ai-orchestrator-secrets
