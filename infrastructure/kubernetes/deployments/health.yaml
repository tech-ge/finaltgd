apiVersion: apps/v1
kind: Deployment
metadata:
  name: techgeo-health
  namespace: techgeo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techgeo-health
  template:
    metadata:
      labels:
        app: techgeo-health
    spec:
      containers:
        - name: health
          image: techgeo/health:latest
          ports:
            - containerPort: 3006
          envFrom:
            - secretRef:
                name: techgeo-health-secrets
